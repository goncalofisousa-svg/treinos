:root{--bg:#f4f4ee;--card:#fff;--ink:#0d0d0d;--mut:#6a6e64;--line:#dcdcd1;--acc:#e0f873;--accink:#0d0d0d;--soft:#f3fcc9;--warn:#9a3b0a;--warnbg:#fde8dc;--disp:'Tilt Warp',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:#f4f4ee}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#app,.brand{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
.brand{background:#0d0d0d;border-radius:18px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.logo{display:inline-flex;align-items:flex-end;font-family:var(--disp);font-size:30px;line-height:.72;color:#e0f873;gap:.05em}
.logo b{font-weight:400;color:#f4f4ee}
.logo i{display:block;width:.17em;height:.17em;border-radius:50%;background:#e0f873;margin:0 .04em .23em;flex:none}
.logo svg{display:block;width:.72em;height:.72em;flex:none}
.brand small{color:#f4f4ee;font-size:12px;letter-spacing:.04em;opacity:.8}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:2px 0 14px}
header .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
header h1{font-family:var(--disp);font-weight:400;font-size:34px;line-height:1.05;margin:4px 0 0}
header .p{font-size:13px;color:var(--mut);text-align:right;white-space:nowrap}
.weeks{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 16px;border-radius:999px;border:2px solid var(--ink);background:none;font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:var(--accink)}
.wnote{font-size:14px;color:var(--mut);margin:0 0 14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.day{position:relative;min-height:62px;border-radius:16px;border:2px solid var(--ink);background:var(--card);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.day .s{font-size:11px;color:var(--mut);font-weight:600}
.day .n{font-family:var(--disp);font-size:19px}
.day.rest{border:2px dashed #b9b9ad;background:none;opacity:.7}
.day.today{box-shadow:0 3px 0 var(--ink)}
.day.on{background:var(--acc);color:var(--accink)}
.day.on .s{color:var(--accink);opacity:.8}
.day i{position:absolute;bottom:4px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:transparent}
.day i.feito{background:var(--ink)}
.day i.nao{background:#b9b9ad}
.banner{background:var(--soft);border-radius:14px;padding:11px 13px;font-size:14px;margin:0 0 12px;border:1px solid #cfe66a}
.card{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:20px 18px;margin-bottom:14px;box-shadow:0 4px 0 var(--ink)}
.card h2{font-family:var(--disp);font-weight:400;font-size:28px;line-height:1.1;margin:0 0 4px}
.meta{color:var(--mut);font-size:14px;margin:0 0 6px}
.card{counter-reset:ex}
.bloco h3{display:inline-block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--acc);padding:3px 10px;border-radius:7px;margin:22px 0 12px;font-weight:700}
.bloco ul{list-style:none;margin:0;padding:0}
.bloco li{position:relative;padding:2px 0 20px 46px;counter-increment:ex}
.bloco li:before{content:counter(ex);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:14px;color:var(--acc)}
.bloco li:after{content:"";position:absolute;left:15px;top:36px;bottom:2px;width:2px;background:#cfcfc4}
.bloco li:last-child:after{display:none}
.bloco .t{font-weight:700;font-size:17px;line-height:1.25}
.bloco .d{display:inline-block;margin-top:5px;padding:3px 10px;border-radius:8px;background:var(--acc);color:var(--ink);font-weight:700;font-size:13px}
.bloco .n{color:var(--mut);font-size:14px;margin-top:2px}
.bloco a{color:var(--ink);font-size:14px;font-weight:600}
.rest-t{margin:0;color:var(--mut)}
.reg h3{font-family:var(--disp);font-weight:400;font-size:24px;margin:0 0 12px}
.reg label{display:block;font-size:12px;color:var(--mut);margin:16px 0 6px;font-weight:700;letter-spacing:.04em}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:0;min-height:48px;border-radius:14px;border:2px solid var(--ink);background:none;padding:0 4px;font-size:14px;font-weight:600}
.seg button.on{background:var(--acc);color:var(--accink)}
.seg.big button{min-height:54px;font-size:16px;font-weight:700}
.seg.big button.on.nao{background:var(--ink);color:var(--acc)}
textarea{width:100%;min-height:72px;border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--ink);padding:10px 12px;font:inherit;line-height:1.4;resize:vertical}
.send{width:100%;min-height:56px;margin-top:18px;border-radius:16px;border:2px solid var(--ink);background:var(--acc);color:var(--ink);font-family:var(--disp);font-size:19px;box-shadow:0 4px 0 var(--ink)}
.send:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.send[disabled]{opacity:.6}
.err{color:var(--warn);font-size:14px;margin:10px 0 0}
.alert{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.done h3{font-family:var(--disp);font-weight:400;margin:0 0 4px;font-size:22px}
.done p{margin:2px 0;color:var(--mut);font-size:14px}
.link{background:none;border:0;color:var(--ink);padding:10px 0 0;font-size:15px;font-weight:600;text-decoration:underline}
.msg{text-align:center;color:var(--mut);padding:48px 8px}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.ex .nm{grid-column:1/-1;font-weight:600;font-size:15px}
.ex .nm small{display:block;font-weight:400;color:var(--mut);font-size:13px;margin-top:2px}
.ex label,.camp label{display:block;margin:0 0 4px;font-size:12px;color:var(--mut)}
.ex input,.camp input{width:100%;box-sizing:border-box;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:16px system-ui,sans-serif}
.camp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.hint{color:var(--mut);font-size:13px;margin:4px 0 0}
.fotos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.fotos .th{position:relative;aspect-ratio:3/4;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.fotos button{position:absolute;top:3px;right:3px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:20px;line-height:1}
.addf{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:6px;border:2px solid var(--ink);border-radius:14px;background:#fff;font-weight:700;font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="brand"><div class="logo" role="img" aria-label="Salto"><b>S</b><i></i><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M16 100 L50 18 L84 100" fill="none" stroke="#e0f873" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/></svg>LTO</div><small>Dá o salto.</small></div>
<div id="app"><p class="msg">A abrir o plano…</p></div>
<noscript><p class="msg">Esta página precisa de JavaScript.</p></noscript>
<script>
(()=>{
'use strict';
const DIAS=[{k:'seg',s:'Seg',l:'Segunda'},{k:'ter',s:'Ter',l:'Terça'},{k:'qua',s:'Qua',l:'Quarta'},{k:'qui',s:'Qui',l:'Quinta'},{k:'sex',s:'Sex',l:'Sexta'},{k:'sab',s:'Sáb',l:'Sábado'},{k:'dom',s:'Dom',l:'Domingo'}];
const ESF=[[3,'Fácil'],[5,'Moderado'],[7,'Duro'],[9,'Muito duro']];
const DOR=[[0,'Nenhuma'],[1,'Ligeira'],[2,'Incomoda']];
const MOT=['Falta de tempo','Cansaço','Dor','Outro'];
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const app=document.getElementById('app');
const qs=new URLSearchParams(location.search);
const slug=(qs.get('c')||'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,60);

function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const dayNum=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=d=>`${d.getDate()} ${MES[d.getMonth()]}`;
const qd=qs.get('d');
const agora=(qd&&/^\d{4}-\d{2}-\d{2}$/.test(qd))?fromIso(qd):new Date();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

let plano=null,inicio=null,store={regs:{}},view={w:1,d:0},draft={},editing={},hoje={w:0,d:0};
const SK='treino:'+slug;
function load(){try{const s=JSON.parse(localStorage.getItem(SK)||'null');if(s&&s.regs)store=s}catch(e){}}
function save(){try{localStorage.setItem(SK,JSON.stringify(store))}catch(e){}}

async function getPlano(){
  const PK='plano:'+slug;
  try{
    const r=await fetch(`planos/${encodeURIComponent(slug)}.json?v=${Date.now()}`,{cache:'no-store'});
    if(!r.ok)throw 0;
    const t=await r.text();const j=JSON.parse(t);
    try{localStorage.setItem(PK,t)}catch(e){}
    return j;
  }catch(e){
    try{const t=localStorage.getItem(PK);if(t)return JSON.parse(t)}catch(e2){}
    return null;
  }
}

const MAXF=4;let fotos={};
function reduzir(file){
  return new Promise((ok,ko)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const m=1500,sc=Math.min(1,m/Math.max(im.width,im.height));
      const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b=>b?ok(b):ko(),'image/jpeg',0.8);
    };
    im.onerror=()=>{URL.revokeObjectURL(u);ko()};
    im.src=u;
  });
}
function blobB64(b){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=ko;r.readAsDataURL(b)})}
async function enviarFoto(entry,blob,n){
  const cfg=plano.envio||{};if(!cfg.url)return false;
  try{
    const body=JSON.stringify({action:'foto',token:cfg.token,cliente:plano.id,id:entry.id,n,data:entry.data,dia:entry.dia,sessao:entry.sessao,img:await blobB64(blob)});
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    const j=await r.json();return !!(j&&j.ok);
  }catch(e){return false}
}
async function enviarFotos(entry,k){
  const f=fotos[k]||[];if(!f.length)return;
  for(let i=0;i<f.length;i++){
    if(f[i].ok)continue;
    f[i].ok=await enviarFoto(entry,f[i].blob,i+1);
  }
  const falta=f.filter(x=>!x.ok).length;
  entry.fotosFalta=falta;entry.fotosTotal=f.length;save();
  if(!falta){delete fotos[k]}
}
async function enviar(entry){
  const cfg=plano.envio||{};
  if(!cfg.url)return 'local';
  const{sent,remoto,cargas,fotosFalta,fotosTotal,...dados}=entry;
  const ct=(cargas||[]).filter(c=>c.kg||c.r).map(c=>c.e+': '+(c.kg?c.kg+' kg':'')+(c.r?' '+c.r:'')).join(' | ');
  const body=JSON.stringify({token:cfg.token,cliente:plano.id,...dados,cargas:ct});
  const hd={'Content-Type':'text/plain;charset=utf-8'};
  try{
    const r=await fetch(cfg.url,{method:'POST',headers:hd,body});
    const j=await r.json();
    return j&&j.ok?'ok':'erro';
  }catch(e){
    try{await fetch(cfg.url,{method:'POST',mode:'no-cors',headers:hd,body});return 'incerto'}catch(e2){return 'erro'}
  }
}
async function flush(){
  for(const[k,r]of Object.entries(store.regs)){
    if(r.sent===false){
      const res=await enviar(r);
      if(res!=='erro'){r.sent=res;save()}
    }
  }
  renderReg();
}
async function sincronizar(){
  const cfg=plano.envio||{};if(!cfg.url)return;
  try{
    const u=`${cfg.url}${cfg.url.includes('?')?'&':'?'}action=feitos&token=${encodeURIComponent(cfg.token||'')}&cliente=${encodeURIComponent(plano.id)}`;
    const r=await fetch(u);const j=await r.json();
    if(j&&j.ok&&Array.isArray(j.feitos)){
      let mudou=false;
      for(const f of j.feitos){if(!store.regs[f.k]){store.regs[f.k]={estado:f.e,sent:'ok',remoto:true};mudou=true}}
      if(mudou){save();render()}
    }
  }catch(e){}
}

const key=(w,d)=>`${w}-${DIAS[d].k}`;
const sessao=(w,d)=>{const s=plano.semanas.find(x=>x.n===w);return s&&s.dias&&s.dias[DIAS[d].k]||null};
const dataDe=(w,d)=>addDays(inicio,(w-1)*7+d);

function seg(opts,val,pick,cls){
  return h('div',{class:'seg '+(cls||''),role:'radiogroup'},opts.map(([v,l])=>h('button',{type:'button',role:'radio','aria-checked':String(val===v),class:(val===v?'on ':'')+(v==='nao'?'nao':''),onclick:()=>pick(v)},l)));
}

function render(){
  const N=plano.totalSemanas||plano.semanas.length;
  const sw=plano.semanas.find(x=>x.n===view.w)||plano.semanas[0];
  app.replaceChildren(
    h('header',null,
      h('div',null,h('div',{class:'k',text:plano.titulo||'Plano de treino'}),h('h1',{text:'Olá, '+plano.cliente}))),
    ...banners(),
    h('div',{class:'weeks',role:'tablist'},plano.semanas.map(s=>h('button',{type:'button',class:'chip'+(s.n===view.w?' on':''),role:'tab','aria-selected':String(s.n===view.w),onclick:()=>{view.w=s.n;render()}},'Sem '+s.n))),
    sw.nota?h('p',{class:'wnote',text:sw.nota}):null,
    h('div',{class:'days',role:'tablist'},DIAS.map((D,i)=>{
      const s=sessao(view.w,i),r=store.regs[key(view.w,i)];
      const isHoje=hoje.w===view.w&&hoje.d===i;
      return h('button',{type:'button',role:'tab','aria-selected':String(i===view.d),class:'day'+(i===view.d?' on':'')+(s?'':' rest')+(isHoje?' today':''),onclick:()=>{view.d=i;render()}},
        h('span',{class:'s',text:D.s}),h('span',{class:'n',text:String(dataDe(view.w,i).getDate())}),r?h('i',{class:r.estado}):null);
    })),
    h('div',{id:'sessao'}),h('div',{id:'reg'})
  );
  renderSessao();renderReg();
}
function banners(){
  const out=[];
  if(!hoje.w){
    const hojeN=dayNum(agora),ini=dayNum(inicio);
    if(hojeN<ini)out.push(h('div',{class:'banner',text:`O plano começa a ${fmt(inicio)}.`}));
    else out.push(h('div',{class:'banner',text:plano.fim||'Este plano terminou. Fala com o teu treinador para o próximo.'}));
  }
  return out;
}
function renderSessao(){
  const box=document.getElementById('sessao');
  const s=sessao(view.w,view.d);
  const D=DIAS[view.d];
  if(!s){
    box.replaceChildren(h('div',{class:'card'},h('h2',{text:D.l+' · descanso'}),h('p',{class:'rest-t',text:(plano.descanso)||'Dia livre. Caminha, hidrata-te e descansa.'})));
    return;
  }
  box.replaceChildren(h('div',{class:'card'},
    h('h2',{text:s.titulo}),
    h('p',{class:'meta',text:[D.l+', '+fmt(dataDe(view.w,view.d)),s.duracao].filter(Boolean).join(' · ')}),
    s.nota?h('p',{class:'meta',text:s.nota}):null,
    (s.blocos||[]).map(b=>h('section',{class:'bloco'},h('h3',{text:b.nome}),h('ul',null,(b.itens||[]).map(it=>h('li',null,
      h('div',{class:'t',text:it.t}),it.d?h('div',{class:'d',text:it.d}):null,it.n?h('div',{class:'n',text:it.n}):null,
      it.v&&/^https:\/\//.test(it.v)?h('a',{href:it.v,target:'_blank',rel:'noopener',text:'Ver vídeo'}):null)))))
  ));
}
function renderReg(){
  const box=document.getElementById('reg');if(!box)return;
  const s=sessao(view.w,view.d);
  if(!s){box.replaceChildren();return}
  const k=key(view.w,view.d),saved=store.regs[k];
  if(saved&&!editing[k]){
    const est=saved.estado==='feito'?'Sessão feita':'Não foi possível fazer';
    const fq=saved.fotosFalta>0&&(fotos[k]||[]).length?h('button',{type:'button',class:'link',onclick:async e=>{e.target.disabled=true;e.target.textContent='A enviar prints…';await enviarFotos(saved,k);renderReg()}},'Enviar os prints que faltam ('+saved.fotosFalta+')'):saved.fotosFalta>0?h('p',{class:'err',text:'Alguns prints não foram enviados. Altera o registo e junta-os de novo.'}):null;
    const st=saved.sent===false?'Guardado no telemóvel. Envia-se sozinho quando houver rede.':saved.sent==='local'?'Guardado neste telemóvel.':'Registo enviado.';
    const det=[];
    if(saved.estado==='feito'&&saved.esforco)det.push('Esforço: '+(ESF.find(e=>e[0]===saved.esforco)||[,''])[1].toLowerCase());
    if(saved.estado==='nao'&&saved.motivo)det.push('Motivo: '+saved.motivo.toLowerCase());
    box.replaceChildren(h('div',{class:'card done'},h('h3',{text:'✓ '+est}),det.length?h('p',{text:det.join(' · ')}):null,h('p',{text:st}),fq,
      saved.remoto?null:h('button',{type:'button',class:'link',onclick:()=>{draft[k]={estado:saved.estado,motivo:saved.motivo||'',esforco:saved.esforco||null,dor:saved.dor??0,nota:saved.nota||'',cargas:saved.cargas||[],km:saved.km||'',min:saved.min||'',fc:saved.fc||''};editing[k]=true;renderReg()}},'Alterar o registo')));
    return;
  }
  const d=draft[k]||(draft[k]={estado:null,motivo:'',esforco:null,dor:0,nota:'',cargas:[],km:'',min:'',fc:''});
  const exs=[];(s.blocos||[]).forEach(b=>(b.itens||[]).forEach(it=>{if(it.reg)exs.push(it)}));
  const campos=Array.isArray(s.campos)?s.campos:[];
  const again=()=>renderReg();
  const err=h('p',{class:'err',hidden:true});
  const dorAlert=d.dor===2?h('div',{class:'alert',text:'Se a dor se mantiver, fala com o teu treinador antes da próxima sessão.'}):null;
  const ta=h('textarea',{placeholder:'Opcional: como correu, o que custou, o que mudavas',oninput:e=>{d.nota=e.target.value.slice(0,500)},maxlength:'500'});ta.value=d.nota;
  const btn=h('button',{type:'button',class:'send',onclick:async()=>{
    if(!d.estado){showErr('Escolhe primeiro se fizeste a sessão.');return}
    if(d.estado==='feito'&&!d.esforco){showErr('Diz-me como foi o esforço.');return}
    btn.disabled=true;btn.textContent='A enviar…';
    const entry={id:uid(),semana:view.w,dia:DIAS[view.d].k,data:iso(dataDe(view.w,view.d)),sessao:s.titulo,estado:d.estado,motivo:d.estado==='nao'?d.motivo:'',esforco:d.estado==='feito'?d.esforco:'',dor:d.estado==='feito'?d.dor:(d.motivo==='Dor'?2:0),nota:d.nota,cargas:d.estado==='feito'?exs.map((it,i)=>({e:it.t,kg:((d.cargas[i]||{}).kg||'').trim(),r:((d.cargas[i]||{}).r||'').trim()})).filter(c=>c.kg||c.r):[],km:d.estado==='feito'?(d.km||'').trim():'',min:d.estado==='feito'?(d.min||'').trim():'',fc:d.estado==='feito'?(d.fc||'').trim():'',ts:new Date().toISOString(),sent:false};
    store.regs[k]=entry;save();delete editing[k];
    const res=await enviar(entry);
    if(res!=='erro'){entry.sent=res;save()}
    if((fotos[k]||[]).length&&res!=='erro'){btn.textContent='A enviar prints…';await enviarFotos(entry,k)}
    else if((fotos[k]||[]).length){entry.fotosFalta=fotos[k].length;entry.fotosTotal=fotos[k].length;save()}
    renderReg();render2();
  }},'Enviar registo');
  function showErr(t){err.textContent=t;err.hidden=false}
  box.replaceChildren(h('div',{class:'card reg'},
    h('h3',{text:'Como correu?'}),
    seg([['feito','✓ Feito'],['nao','✗ Não consegui']],d.estado,v=>{d.estado=v;again()},'big'),
    d.estado==='nao'?[h('label',{text:'Motivo (opcional)'}),seg(MOT.map(m=>[m,m]),d.motivo,v=>{d.motivo=d.motivo===v?'':v;again()})]:null,
    d.estado==='feito'&&exs.length?[h('label',{text:'Cargas e repetições'}),h('p',{class:'hint',text:'Escreve a carga que usaste e as repetições de cada série (por exemplo 10/10/9). Se não fizeste um exercício, deixa em branco.'}),
      ...exs.map((it,i)=>{const c=d.cargas[i]||(d.cargas[i]={kg:'',r:''});
        return h('div',{class:'ex'},h('div',{class:'nm'},it.t,it.d?h('small',{text:'Plano: '+it.d}):null),
          h('div',null,h('label',{text:'Carga (kg)'}),h('input',{type:'text',inputmode:'decimal',maxlength:'8',autocomplete:'off',value:c.kg,oninput:e=>{c.kg=e.target.value}})),
          h('div',null,h('label',{text:'Repetições'}),h('input',{type:'text',inputmode:'text',maxlength:'24',autocomplete:'off',placeholder:'10/10/9',value:c.r,oninput:e=>{c.r=e.target.value}})))})]:null,
    d.estado==='feito'&&campos.length?[h('label',{text:'Corrida (opcional)'}),h('div',{class:'camp'},
      campos.includes('km')?h('div',null,h('label',{text:'Distância (km)'}),h('input',{type:'text',inputmode:'decimal',maxlength:'6',value:d.km,oninput:e=>{d.km=e.target.value}})):null,
      campos.includes('min')?h('div',null,h('label',{text:'Duração (min)'}),h('input',{type:'text',inputmode:'decimal',maxlength:'6',value:d.min,oninput:e=>{d.min=e.target.value}})):null,
      campos.includes('fc')?h('div',null,h('label',{text:'FC média'}),h('input',{type:'text',inputmode:'numeric',maxlength:'3',value:d.fc,oninput:e=>{d.fc=e.target.value}})):null)]:null,
    d.estado==='feito'?[h('label',{text:'Esforço'}),seg(ESF,d.esforco,v=>{d.esforco=v;again()}),
      h('label',{text:'Dor ou desconforto'}),seg(DOR,d.dor,v=>{d.dor=v;again()}),dorAlert]:null,
    d.estado==='feito'?fotosUI(k,again):null,
    h('label',{text:'Nota'}),ta,err,btn));
}
function fotosUI(k,again){
  const f=fotos[k]||(fotos[k]=[]);
  const msg=h('p',{class:'hint'});
  const inp=h('input',{type:'file',accept:'image/*',multiple:true,class:'sr',id:'fin',onchange:async e=>{
    const fs=[...e.target.files];e.target.value='';
    let falhou=0;
    for(const file of fs){
      if(f.length>=MAXF)break;
      try{const b=await reduzir(file);f.push({blob:b,url:URL.createObjectURL(b),ok:false})}catch(x){falhou++}
    }
    again();
    if(falhou){const m=document.querySelector('.fotos+.hint');if(m)m.textContent='Não consegui abrir '+falhou+' imagem(ns).'}
  }});
  return [h('label',{text:'Prints do relógio ou da app (opcional)'}),
    h('p',{class:'hint',text:'Junta até 4 imagens do treino. O teu treinador analisa-as depois, não precisas de escrever os números.'}),
    f.length?h('div',{class:'fotos'},f.map((x,i)=>h('div',{class:'th'},h('img',{src:x.url,alt:'Print '+(i+1)}),h('button',{type:'button','aria-label':'Remover print '+(i+1),onclick:()=>{URL.revokeObjectURL(x.url);f.splice(i,1);again()}},'×')))):null,
    msg,
    f.length<MAXF?h('label',{class:'addf',for:'fin'},f.length?'Juntar mais':'Juntar prints'):null,inp];
}
function render2(){ // atualiza só os pontos dos dias
  document.querySelectorAll('.day').forEach((el,i)=>{
    const r=store.regs[key(view.w,i)];const old=el.querySelector('i');if(old)old.remove();
    if(r)el.append(h('i',{class:r.estado}));
  });
}

async function init(){
  if(!slug){app.replaceChildren(h('p',{class:'msg',text:'Abre o link que o teu treinador te enviou.'}));return}
  load();
  plano=await getPlano();
  if(!plano||!Array.isArray(plano.semanas)||!plano.semanas.length){app.replaceChildren(h('p',{class:'msg',text:'Não foi possível abrir o plano. Verifica a ligação e o link.'}));return}
  document.title=plano.cliente?`Treino · ${plano.cliente}`:'Treino';
  inicio=fromIso(plano.inicio);
  const diff=dayNum(agora)-dayNum(inicio);
  const first=plano.semanas[0].n,last=plano.semanas[plano.semanas.length-1].n;
  const wk=diff>=0?Math.floor(diff/7)+1:0;
  if(diff>=0&&wk>=first&&wk<=last){hoje={w:wk,d:diff%7};view={w:hoje.w,d:hoje.d}}
  else if(diff<0||wk<first)view={w:first,d:0};else view={w:last,d:0};
  render();
  flush();sincronizar();
  window.addEventListener('online',flush);
}
init();
})();
